<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caramel Foods & Beverages - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    
</head>
<body>

    <div class="nav-menu">
        <div class="logo"> Caramel Foods & Beverages</div>
        <nav class="nav-links">
            <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
            <a href="about.html"><i class="fa-solid fa-circle-info"></i>About Us</a>
            <a><i class="fa-solid fa-phone"></i>Contact Us</a>
        </nav>
    </div>

    <section class="about-banner">
        <h2>Contact Us For a Job Opportunity</h2>
        <p>We'd love to hear from you and what you can serve</p>
    </section>
  <div class="form">
            <h3>Reach To Us</h3>
            <form method="POST" action="#">
                <label for="fname">Full Name:</label>
                <input type="text" id="fname" name="name" placeholder="Enter your full name" required autofocus>

               <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="bdate" required>
                <label for="em">Email Address:</label>
                <input type="email" id="em" name="email"  required>

                <label>Gender:</label>
                <div class="radio">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>

                <label for="description">Tell us about yourself:</label>
                <textarea id="description" name="description" rows="4" placeholder="Write a short description about yourself..."></textarea>

                <button type="submit" class="button">APPLY</button>

            </form>
        </div>
    <footer class="footer">
        <p>&copy; 2025 Caramel Foods & Beverages. All Rights Reserved</p>
        <p>Kampala, Uganda Tel: +256 752567450</p>
    </footer>

</body>
</html>
